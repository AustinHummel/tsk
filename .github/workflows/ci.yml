name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --locked
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log
      # Logs need a sign-in to read; a commit comment does not. On a
      # failure, the failing tests' output is posted on the commit.
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          excerpt=$(grep -n -E "panicked|FAILED|failures:|^error" -A 25 test.log | tail -c 50000)
          printf 'ci failure on %s\n\n```\n%s\n```\n' "${{ matrix.os }}" "$excerpt" > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md || true
