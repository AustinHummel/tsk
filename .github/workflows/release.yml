# Build a binary per platform when a version tag is pushed, and publish a
# GitHub release carrying every archive plus SHA256SUMS. No Rust toolchain
# is needed to install from it: download, verify, put `tsk` on PATH.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="tsk-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/tsk.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/tsk" "dist/${name}/"
          fi
          cp README.md PHILOSOPHY.md LICENSE "dist/${name}/"
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum tsk-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Verify a download before using it:

            ```
            sha256sum -c SHA256SUMS --ignore-missing      # Linux, macOS, Git Bash
            (Get-FileHash tsk-*.zip).Hash; Get-Content SHA256SUMS   # PowerShell: compare by eye
            ```
