[package]
name = "tsk"
version = "0.1.0"
edition = "2021"
description = "A task CLI for breaking work down at any depth, built the way Git is built"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
