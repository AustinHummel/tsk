[package]
name = "tsk"
version = "0.5.0"
edition = "2021"
description = "A simple CLI for project planning and tracking. Command language inspired by Git."
repository = "https://github.com/AustinHummel/tsk"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2

[dev-dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
